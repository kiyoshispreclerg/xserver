# XiS fork CI: debug/release builds + lint, sanitizers and the Xorg test suite.
# Everything upstream-specific (other OSes, cross builds, qemu, docker images)
# was dropped on purpose. No packages are produced here yet.
name: XiS CI

permissions:
    contents: read

env:
    MESON_BUILDDIR:  "__BUILD"
    X11_PREFIX:      /home/runner/x11
    X11_BUILD_DIR:   /home/runner/work/xserver/xserver/WORK/sources/3rdparty
    GOXPROTO_REF:    v0.0.8

on:
    push:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-lint:
        # Debug and release builds with -Werror, the manpage placeholder check
        # and clang-tidy, in sequence on one VM so the package install and the
        # xorgproto build are paid once. Each step runs even if an earlier one
        # failed, so one problem doesn't hide the others. The distro matrix
        # (Debian 12/13, Ubuntu 22.04/24.04 in containers) comes later.
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        env:
            COMMON_ARGS: -Dprefix=/usr -Dxorg=true -Dxvfb=true -Dxephyr=true -Dxnest=true -Dxfbdev=true -Dxcsecurity=true -Dwerror=true -Dtest_xephyr_gles=false
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: apt retries and timeouts (a slow mirror must not hang the job)
              run: |
                  printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
            - uses: ./.github/actions/ubuntu-install-pkg
            - name: xorgproto (runner image is too old for presentproto >= 1.4) + clang-tidy
              run: |
                  sudo apt-get install -y clang-tidy
                  echo "PKG_CONFIG_PATH=$X11_PREFIX/share/pkgconfig:$X11_PREFIX/lib/$(gcc -dumpmachine)/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
                  . .github/scripts/util.sh
                  mkdir -p "$X11_BUILD_DIR"
                  cd "$X11_BUILD_DIR"
                  build_meson xorgproto $(fdo_mirror xorgproto) "$PKG_XORGPROTO_REF"

            # The debug tree is called "build" because manpages-check looks
            # there, and clang-tidy uses its compile_commands.json.
            - name: build and meson test (debug)
              env:
                  MESON_BUILDDIR: build
                  MESON_ARGS: --buildtype=debug ${{ env.COMMON_ARGS }}
                  MESON_TEST_ARGS: --no-rebuild
              run: .github/scripts/meson-build.sh --run-test

            - name: build and meson test (release)
              if: ${{ !cancelled() }}
              env:
                  MESON_BUILDDIR: __BUILD
                  MESON_ARGS: --buildtype=release ${{ env.COMMON_ARGS }}
                  MESON_TEST_ARGS: --no-rebuild
              run: .github/scripts/meson-build.sh --run-test

            - name: manpage placeholders
              if: ${{ !cancelled() && hashFiles('build/build.ninja') != '' }}
              run: .github/scripts/manpages-check

            - name: clang-tidy on changed files
              if: ${{ !cancelled() && hashFiles('build/compile_commands.json') != '' }}
              env:
                  BEFORE: ${{ github.event.before }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  base="${BASE_SHA:-$BEFORE}"
                  case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
                  git cat-file -e "$base^{commit}" 2>/dev/null || base="HEAD~1"
                  files="$(git diff --name-only --diff-filter=d "$base" HEAD -- '*.c' | grep -v '^test/' || true)"
                  if [ -z "$files" ]; then echo "no C files changed"; exit 0; fi
                  echo "$files" | xargs -r -P"$(nproc)" -n1 clang-tidy -p build --quiet

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: build-logs
                  path: |
                      build/meson-logs/*
                      __BUILD/meson-logs/*

    sanitizers:
        # AddressSanitizer + UBSanitizer on Xvfb, running meson test (unit
        # tests + pyxtest). Leak detection is off: the server deliberately
        # does not free everything on exit, which would fail every test.
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            MESON_ARGS: --buildtype=debug -Db_sanitize=address,undefined -Db_lundef=false -Dprefix=/usr -Dxorg=false -Dxvfb=true -Dxnest=false -Dxephyr=false -Dwerror=true
            ASAN_OPTIONS: detect_leaks=0:abort_on_error=0
            UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        steps:
            - uses: actions/checkout@v4
            - name: apt retries and timeouts (a slow mirror must not hang the job)
              run: |
                  printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
            - uses: ./.github/actions/ubuntu-install-pkg
            - name: xorgproto
              run: |
                  echo "PKG_CONFIG_PATH=$X11_PREFIX/share/pkgconfig:$X11_PREFIX/lib/$(gcc -dumpmachine)/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
                  . .github/scripts/util.sh
                  mkdir -p "$X11_BUILD_DIR"
                  cd "$X11_BUILD_DIR"
                  build_meson xorgproto $(fdo_mirror xorgproto) "$PKG_XORGPROTO_REF"
            - name: build and meson test (ASan + UBSan)
              run: .github/scripts/meson-build.sh --run-test
              env:
                  MESON_TEST_ARGS: --no-rebuild
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: build-logs-sanitizers
                  path: __BUILD/meson-logs/*

            # UBSan is report-only (halt_on_error=0), so the server isn't
            # killed by the first finding; list what it found instead.
            - name: UBSan findings
              if: ${{ !cancelled() }}
              run: |
                  {
                      echo "### UBSan findings"
                      echo
                      grep -h "runtime error" /tmp/xserver-* 2>/dev/null | sort | uniq -c | sort -rn | head -50 | sed 's/^/    /' || true
                  } | tee -a "$GITHUB_STEP_SUMMARY"

            # pyxtest keeps each server's ASan report and stderr in /tmp (it
            # sets log_path itself, so ASAN_OPTIONS can't redirect them). A
            # server that crashes mid-test is reported by pytest only as
            # "Server crashed", so these files are where the stack trace is.
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: asan-reports
                  path: |
                      /tmp/xserver-*
                  if-no-files-found: ignore

    xorg-testsuite:
        # Xorg's own suite: unit tests, XTS, piglit and rendercheck, using
        # the prerequisite builder shared with upstream. Slowest job.
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        env:
            MESON_ARGS: -Dprefix=/usr -Dxephyr=true -Dwerror=true -Dxcsecurity=true -Dxorg=true -Dxvfb=true -Dxnest=true -Dxfbdev=true -Dtest_xephyr_gles=false
            LIBGL_ALWAYS_SOFTWARE: 1
            GALLIUM_DRIVER: llvmpipe
            PIGLIT_PLATFORM: x11_egl
        steps:
            - uses: actions/checkout@v4
            - name: apt retries and timeouts (a slow mirror must not hang the job)
              run: |
                  printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries
            - uses: ./.github/actions/ubuntu-install-pkg
            - name: prepare build environment
              run: |
                  MACHINE=`gcc -dumpmachine`
                  echo "MACHINE=$MACHINE" >> "$GITHUB_ENV"
                  echo "PKG_CONFIG_PATH=$X11_PREFIX/share/pkgconfig:$X11_PREFIX/lib/$MACHINE/pkgconfig:$X11_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
                  sudo chown root /bin/tar && sudo chmod u+s /bin/tar
            - name: X11 prereq cache
              uses: actions/cache@v5
              with:
                  path: |
                      ${{ env.X11_PREFIX }}
                      ${{ env.X11_BUILD_DIR }}/xts
                      ${{ env.X11_BUILD_DIR }}/piglit
                      ${{ env.X11_BUILD_DIR }}/goxproto
                  key: ${{ runner.name }}-x11-deps-${{ hashFiles('.github/scripts/ubuntu/install-prereq.sh') }}
                  restore-keys: ${{ runner.name }}-x11-deps-
            - name: build and test
              run: .github/scripts/ubuntu/run-xserver-build-and-test.sh
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: build-logs-testsuite
                  path: |
                      __BUILD/meson-logs/*
                      __BUILD/test/piglit-results/*
